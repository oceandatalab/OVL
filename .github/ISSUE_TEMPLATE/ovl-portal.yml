name: OVL portal
description: Report a bug, ask a question or suggest an improvement about the OVL portal
labels: ["OVL portal"]
body:
  - type: markdown
    attributes:
      value: |
        For the web portal at <https://ovl.oceandatalab.com>.
        The [OVL portal chapter](https://oceandatalab.github.io/OVL/doc/ovl/) of
        the manual may already answer your question.

  - type: dropdown
    id: kind
    attributes:
      label: What is this about?
      options:
        - Something does not work
        - A question about how to use the portal
        - A suggestion
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe it
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The datasets you had activated, the area and the date help a lot.
      placeholder: |
        1. Activate ...
        2. Move to ...
        3. ...

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Firefox 128, Chrome 127, Safari 17 ...

  - type: input
    id: url
    attributes:
      label: Link to the view
      description: The URL of the portal when the problem happened, if you still have it.
