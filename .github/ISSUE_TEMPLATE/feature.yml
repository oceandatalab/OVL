name: Feature request
description: Suggest something new or an improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - OVL portal
        - SEAScope
        - SEAShot
        - The manual
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What would you like?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What would it help you do?
