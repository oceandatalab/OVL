name: SEAScope
description: Report a bug, ask a question or suggest an improvement about the SEAScope application
labels: ["SEAScope"]
body:
  - type: markdown
    attributes:
      value: |
        For the standalone application and its Python bindings.
        The [SEAScope chapter](https://oceandatalab.github.io/OVL/doc/seascope/)
        of the manual covers installation, adding data and the IDF converter.

  - type: dropdown
    id: kind
    attributes:
      label: What is this about?
      options:
        - Something does not work
        - A question about how to use SEAScope
        - A problem converting data to IDF
        - A suggestion
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe it
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SEAScope version
      description: The version of the viewer you downloaded, and of the seascope Python package if you use it.
      placeholder: seascope-viewer-20250709

  - type: textarea
    id: logs
    attributes:
      label: Messages
      description: Anything printed in the terminal, or the error you saw. Pasted here it is formatted automatically.
      render: shell
