name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - OVL portal
        - SEAScope
        - SEAShot
        - The manual
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it

  - type: input
    id: context
    attributes:
      label: Version, system or browser
